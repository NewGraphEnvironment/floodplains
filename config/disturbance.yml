# Shared, province-wide disturbance sources for land-cover-change attribution (#19).
# Same for every area (these are DataBC layers loaded into fwapg via bc2pg), so this lives here
# rather than duplicated in each config/<area>/area.yml -- mirrors config/regions/*.yml.
#
# fp_disturbance_tag() tags each transition patch with, per source: in_<name> + the `carry`
# attributes of the dominant overlapping feature, windowed to the change interval
# (cfg$change_interval, default 2017-2023 -- only a disturbance inside the change window can explain
# an observed loss). Attribution is additive; the residual (matches no source) is the noise floor.
#
# Per source: name, table (fwapg schema.table), geom_col, year_col, carry [cols], optional
# `filter` (extra SQL predicate) and `window` [from, to] override, and a `confidence` label.
#
# LIST ORDER IS PRECEDENCE for any single-cause reporting. Tagging itself is additive -- a patch
# can carry in_fire AND in_harvest -- but anything that has to pick one cause per patch takes the
# FIRST source listed here, which is why fire precedes harvest (salvage after a fire is a fire).
# Not cosmetic: on BULK only 2 patches carry both tags and reversing the order still moves
# 36.31 ha between the two buckets in the README figure.
#
# CONTEXT (#95) is a second list, tagged onto the same patches by the same code, and it is NOT a
# cause. An FWA wetland says where a patch is, not why it changed: it has no year and no window, and
# it never reaches the attribution report or the README figure, which read `sources:` only. Filing
# one under `sources:` would count every wetland patch as "explained" and shrink the residual for
# nothing. fp_disturbance_validate() refuses a source with no year_col and a context entry with one.
#
# Carry the feature KEY, not its attributes: a carried column is copied onto the patch under its own
# name, and fwa_wetlands_poly has an `area_ha` that would overwrite the patch's area. The validator
# refuses any carry that collides with a patch column (FP_PATCH_CORE in fp_disturbance.R).
sources:
  - name: fire
    table: whse_land_and_natural_resource.prot_historical_fire_polys_sp
    geom_col: geom
    year_col: fire_year
    carry: [fire_year, fire_number]
    confidence: high
  - name: harvest
    table: whse_forest_vegetation.veg_consolidated_cut_blocks_sp
    geom_col: geom
    year_col: harvest_start_year_calendar
    carry: [harvest_start_year_calendar]
    confidence: high
    # Loaded once via bc2pg (Harvested Areas of BC / Consolidated Cutblocks, record
    # b1b647a6-f271-42e0-9cd0-89ec24bce9f7) filtered HARVEST_START_YEAR_CALENDAR >= 2017.
  # pest (deferred): whse_forest_vegetation.pest_infestation_poly, year_col capture_year,
  #   filter to a disease-species subset; confidence: low (defoliation is not always stand-replacing).

context:
  - name: wetland
    table: whse_basemapping.fwa_wetlands_poly
    geom_col: geom
    carry: [waterbody_poly_id]
    # FWA wetland polygons (1:20,000). The floodplain delineation also seeds wetlands
    # (flood_scenarios.csv `wetlands = TRUE`).
