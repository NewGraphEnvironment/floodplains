# Morice watershed group (MORR) — first NEW area. DRAFT — refine during the MORR run.
# MORR is a first-class link watershed group (appears in the BULK drainage closure).
name: morr
watershed_group: MORR          # link aoi
species: all                   # the whole network, no access filter (#104, #125)
min_order: 2
schema: morr                   # dedicated persist schema
primary_scenario: all_ff04     # headline scenario for LULC (03)
# Publish targets: MORR carried a `targets:` block naming its coho (co_ff04) and chinook (ch_ff06)
# items. Both are retired under #125 (stac_floodplains_bc#76), so the block is gone and MORR falls
# back to the single {species, primary_scenario} item, all_ff04. The co_* and ch_* rows stay in
# flood_scenarios.csv and their outputs in data/morr/; nothing runs them.
# OPEN QUESTION (resolve during the MORR run): does MORR run as the WHOLE watershed group,
# or is it subset to a reach the way Neexdzii is subset from BULK? Default: whole WSG.
subset: null
attribute_by: blue_line_key
network_source: fresh
# No break_points.csv — whole-WSG single sub-basin (it lost its break points in #48).
