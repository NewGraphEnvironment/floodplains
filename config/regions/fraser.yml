# Fraser region — the watershed groups in the sern_fraser_2024 project, WHOLE NETWORK (#125). Every
# group is `species: all`: the whole stream network at order >= 2 with no access filter, one floodplain
# per group, attributed by blue_line_key (#104), habitat joined afterwards from habitat_link.
#
# This file used to carry `species: [ch, bt]`, resolved per group by the run_region pre-pass. The
# ch_* items it produced are retired by the publish layer as each group's all_* item replaces them
# (stac_floodplains_bc#76); their rows in each flood_scenarios.csv and their outputs in data/<wsg>/
# are left in place.
region: fraser
mergin_project: newgraph/sern_fraser_2024
network: whole                   # every group is species: all, order >= 2 (#125)
# network_source: GRAB from `fresh` -- link's province-wide rebuild. Provenance is per-WSG ROWS in
# `fresh.log`, keyed by watershed_group_code; read it with
# `link::lnk_log_read(conn, lnk_config("default"), aoi = "<WSG>")`. `fresh`, not `fresh_default`:
# BOWR, MCGR, THOM, LNTH and UNTH are absent from fresh_default.streams (measured 2026-10-13).
#
# The freshness guard compares the grabbed order >= 2 km against `fresh.streams_vw_bcfp` with no
# access predicate in whole mode. Grabbing FROM `fresh` makes that a schema compared against a view
# over itself, so a pass verifies little. Measured 2026-10-13, order >= 2 km in fresh.streams, equal
# to the bcfp view in every group: LCHL 2,460, LSAL 1,397, WILL 2,296, TABR 1,544, UFRA 5,059,
# NECR 3,523, MORK 6,790, FRAN 4,993, BOWR 2,568, MCGR 2,833, THOM 2,975, LNTH 3,705, UNTH 3,784.
#
# MCGR was blocked (#76) because it had NO rows in fresh.streams on 2026-09-03. It has 2,833 km now,
# so whole mode can run it; its first run is the confirmation.
network_source: fresh
# attribute_by is owned by whole mode (blue_line_key, #104) and needs no line here.
watershed_groups: [LCHL, LSAL, WILL, TABR, UFRA, NECR, MORK, FRAN, BOWR, MCGR, THOM, LNTH, UNTH]
