# Peace region — Peace/Parsnip drainage (Arctic slope), WHOLE NETWORK (#125). Every group is
# `species: all`: the whole stream network at order >= 2 with no access filter, one floodplain per
# group, attributed by blue_line_key (#104), habitat joined afterwards from habitat_link. Same
# whole-WSG treatment as every region (no break_points.csv => the FWA group polygon is the single
# sub-basin).
#
# This file used to carry `species: [bt]`. The bt_* items it produced are retired by the publish layer
# as each group's all_* item replaces them (stac_floodplains_bc#76); their rows in each
# flood_scenarios.csv and their outputs in data/<wsg>/ are left in place.
region: peace
mergin_project: TBD              # doc-only; set when a Peace field project exists
network: whole                   # every group is species: all, order >= 2 (#125)
# network_source: GRAB from `fresh` -- link's province-wide rebuild. Provenance is per-WSG ROWS in
# `fresh.log`, keyed by watershed_group_code; read it with
# `link::lnk_log_read(conn, lnk_config("default"), aoi = "<WSG>")`.
#
# The freshness guard compares the grabbed order >= 2 km against `fresh.streams_vw_bcfp` with no
# access predicate in whole mode. Measured 2026-10-13, order >= 2 km, equal in fresh, fresh_default
# and the bcfp view: PCEA 5,494, PARS 5,167, PINE 5,768.
#
# PINE's 10.8% shortfall against bcfp (#76) was measured on the bull-trout ACCESSIBLE network. Its
# whole network matches bcfp to the km, so whole mode can run it; its first run is the confirmation.
network_source: fresh
# attribute_by is owned by whole mode (blue_line_key, #104) and needs no line here.
watershed_groups: [PCEA, PARS, PINE]
