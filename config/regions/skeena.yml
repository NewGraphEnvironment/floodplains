# Skeena region — upper Skeena drainage, WHOLE NETWORK (#125). Every group is `species: all`: the
# whole stream network at order >= 2 with no access filter, one floodplain per group, attributed by
# blue_line_key (#104). Habitat is joined afterwards from the habitat_link table step 1 writes, so a
# species question is a query, not a re-run. Same whole-WSG treatment as every region (no
# break_points.csv => the FWA group polygon is the single sub-basin).
#
# This file used to carry `species: [co]`, with KISP split into skeena_ch.yml because its species was
# chinook and a region file holds ONE species preference. With no species there is nothing to differ,
# so KISP is folded back in and skeena_ch.yml is gone. The co_* / ch_* items it produced are retired
# by the publish layer as each group's all_* item replaces them (stac_floodplains_bc#76); their rows in
# each flood_scenarios.csv and their outputs in data/<wsg>/ are left in place.
#
# BULK (Bulkley) runs the ENTIRE Bulkley group as a single sub-basin. NEEXDZII (Upper Bulkley)
# is a geographic SUBSET of BULK and is deliberately NOT rostered here — publishing both would
# produce two overlapping items over the same ground. It stays the coho parity fixture.
region: skeena
mergin_project: TBD              # doc-only; set when a Skeena field project exists
network: whole                   # every group is species: all, order >= 2 (#125)
# network_source: GRAB from `fresh` -- link's province-wide rebuild. Provenance is per-WSG ROWS in
# `fresh.log`, keyed by watershed_group_code; read it with
# `link::lnk_log_read(conn, lnk_config("default"), aoi = "<WSG>")`.
#
# The freshness guard compares the grabbed order >= 2 km against `fresh.streams_vw_bcfp` with no
# access predicate in whole mode. Grabbing FROM `fresh` makes that a schema compared against a view
# over itself, so a pass verifies little. Measured 2026-10-13, order >= 2: BULK 5,929 km, MORR 3,471,
# KISP 4,231, equal in fresh, fresh_default and the bcfp view.
network_source: fresh
# attribute_by is owned by whole mode (blue_line_key, #104) and needs no line here.
watershed_groups: [BULK, MORR, KISP]   # NEEXDZII (subset of BULK) intentionally excluded
