# Skeena region — upper Skeena drainage. Coho is the target species: chinook do not carry
# these upper-Skeena networks, so `co` runs the whole watershed group. Same whole-WSG
# treatment as the Fraser/Peace groups (no break_points.csv => the FWA group polygon is the
# single sub-basin).
#
# BULK (Bulkley) runs the ENTIRE Bulkley group as a single sub-basin. NEEXDZII (Upper Bulkley)
# is a geographic SUBSET of BULK and is deliberately NOT rostered here — publishing both would
# produce two overlapping items over the same ground. Add it only if a distinct subset item is
# wanted.
region: skeena
mergin_project: TBD              # doc-only; set when a Skeena field project exists
min_order: 3
species: [co]                    # coho only on these upper-Skeena groups
# attribute_by (#40): also write a per-watercourse floodplain (<scenario>_by_blue_line_key) for the
# primary scenario, so "where is the floodplain of THIS river?" is answerable -- the question that
# blocked Morice sampling.
#
# blue_line_key, NOT gnis_name (#48). gnis_name reads better but answers the question for barely a
# third of the ground: on MORR it yields 33 rows and pools 320.6 km2 -- 78% of the floodplain -- into
# a single unnamed feature, so a click anywhere in it returns NA. The channels hidden in there are
# not slivers (largest carry 20.1, 19.6, 17.1 km of network). blue_line_key resolves all 340 with no
# NA group, and loses nothing: on MORR every named river is exactly ONE blue_line_key (Morice
# 360885316, Thautil 360882037, ...) and no key carries two names, so it is a strict refinement.
# Readability is recovered by the carried gnis_name label column rather than by grouping on the name.
#
# Cost is not the tradeoff it looks like: 85% of attribution is k-independent (0.39 s per extra
# group, measured on MORR at 16.5M cells), so 307 extra groups is ~2 minutes on a ~15 min pass.
# Primary scenario only. Remove this line to turn it off.
attribute_by: blue_line_key
# network_source (#52): GRAB from `fresh` -- link's province-wide rebuild, 2026-08-31/09-01.
# The per-WSG schemas (morr/bulk/necr/pars) hold July networks and were NOT touched by that rebuild
# (streams last analyzed 2026-07-09..19), so BUILDing there would ignore the rebuild entirely.
#
# Provenance is per-WSG ROWS in `fresh.log`, keyed by watershed_group_code -- not a log table inside
# each persist schema. Read it with `link::lnk_log_read(conn, lnk_config("default"), aoi = "<WSG>")`,
# which is authoritative; introspecting information_schema for per-schema log tables finds nothing
# and reads as "no provenance", which is wrong. All four target WSGs return one row each carrying
# `config_hash` (sha256:19e3a...), the value #52's provenance table records.
#
# CAVEAT ON THE GUARD: the freshness guard compares grabbed km against `fresh.streams_vw_bcfp`
# (01_network_extract.R:143). Grabbing FROM `fresh` makes that a schema compared against a view over
# itself -- it passes at ~0% deviation and verifies nothing. Left at the default so the stamp still
# records the comparison, but a pass here is not evidence of freshness the way it is for columbia
# (which grabs from `fresh_default`, a genuinely different schema).
network_source: fresh
watershed_groups: [BULK, MORR]   # whole-WSG coho; NEEXDZII (subset of BULK) intentionally excluded
