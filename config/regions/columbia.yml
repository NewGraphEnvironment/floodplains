# Columbia region — Kootenay/Columbia groups, WHOLE NETWORK (#125). Every group is `species: all`:
# the whole stream network at order >= 2 with no access filter, one floodplain per group, attributed
# by blue_line_key (#104), habitat joined afterwards from habitat_link. DUNC (#120) was the first
# whole-network area and joins the roster here.
#
# This file used to carry `species: [bt, wct]`. Anadromous salmon do not reach these groups (Grand
# Coulee and Chief Joseph since 1942; Bonnington Falls before that), which is why bull trout was the
# target and why access_ch/co/st are the -9 "not modelled" sentinel here. Whole mode reads no access
# column, so none of that decides anything any more. The bt_* items are retired by the publish layer
# as each group's all_* item replaces them (stac_floodplains_bc#76); their rows in each
# flood_scenarios.csv and their outputs in data/<wsg>/ are left in place.
#
# network_source: GRAB from fresh_default (link `default` config), not `fresh`: KOTL, LARL and SLOC
# are absent from fresh.streams (measured 2026-10-13). fresh_default carries DUNC too
# (NewGraphEnvironment/link#328), with streams and habitat tables.
#
# network_guard is gone (strict). It was `warn` because the bt ACCESSIBLE network in fresh_default
# diverged +1.8% (LARL) / +2.5% (KOTL) / +6.6% (SLOC) from the bcfp reference: the `default` bundle
# leaves subsurfaceflow off as a natural barrier where `bcfishpass` opts it in. Whole mode compares
# order >= 2 km with no access predicate, and that agrees to the km. Measured 2026-10-13 in
# fresh_default.streams vs fresh.streams_vw_bcfp: KOTL 5,723 / 5,723, LARL 4,540 / 4,540,
# SLOC 2,636 / 2,636, DUNC 3,493 / 3,493.
region: columbia
mergin_project: TBD              # doc-only; set when a Columbia field project exists
network: whole                   # every group is species: all, order >= 2 (#125)
network_source: fresh_default    # GRAB (skip the per-WSG link build)
# attribute_by is owned by whole mode (blue_line_key, #104) and needs no line here.
watershed_groups: [KOTL, LARL, SLOC, DUNC]
